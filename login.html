<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 회원 관리 시스템</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="login-box">
      <div class="logo-area">
        <h1 class="site-title">회원 관리 시스템</h1>
        <p class="site-sub">아이디와 비밀번호를 입력하세요</p>
      </div>

      <div id="error-msg" class="msg-box error-box" style="display:none"></div>

      <form action="login_check.php" method="post">
        <div class="field-group">
          <label for="id-input">아이디</label>
          <input type="text" name="username" id="id-input" class="text-input"
            placeholder="아이디 입력" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label for="pw-input">비밀번호</label>
          <input type="password" name="password" id="pw-input" class="text-input"
            placeholder="비밀번호 입력" autocomplete="current-password" required>
        </div>
        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <p class="bottom-link">계정이 없으신가요? <a href="register.html">회원가입</a></p>
    </div>
  </main>

  <script>
    (function() {
      var p = new URLSearchParams(location.search);
      if (p.get('err') === '1') {
        var box = document.getElementById('error-msg');
        box.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
        box.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
